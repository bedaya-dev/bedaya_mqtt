name: bedaya_mqtt
description: >-
  Typed, reliable MQTT for Dart: auto reconnect, offline queue, typed topics,
  device and controller roles. Works in Flutter, CLI, servers and the web.
version: 0.1.0
repository: https://github.com/bedaya-dev/bedaya_mqtt
issue_tracker: https://github.com/bedaya-dev/bedaya_mqtt/issues
topics:
  - mqtt
  - iot
  - esp32
  - websocket
  - messaging

environment:
  sdk: ^3.13.2

dependencies:
  mqtt_client: ^10.13.0
  typed_data: ^1.4.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
