name: bedaya_mqtt
description: >-
  Reliable MQTT for Flutter & Dart IoT apps. Auto reconnect, offline queue,
  typed topics, device and controller roles.
version: 0.1.2
repository: https://github.com/bedaya-dev/bedaya_mqtt
issue_tracker: https://github.com/bedaya-dev/bedaya_mqtt/issues
topics:
  - mqtt
  - iot
  - esp32
  - websocket
  - messaging

environment:
  sdk: ^3.13.2

dependencies:
  mqtt_client: ^10.13.0
  typed_data: ^1.4.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
