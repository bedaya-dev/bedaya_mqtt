# Local broker for integration tests. See tool/mosquitto.sh.
per_listener_settings true

# Plain TCP, no login.
listener 1883
allow_anonymous true

# TCP with username/password (user: bedaya, password: secret).
listener 1884
allow_anonymous false
password_file /mosquitto/config/passwd

# MQTT over WebSocket, no login.
listener 8080
protocol websockets
allow_anonymous true

# TLS. The certificate is signed by our own CA (certs/ca.crt), so clients
# must trust it with ClientConfig.caCertificate.
listener 8883
allow_anonymous true
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# TLS + client certificate (mutual TLS): clients must also send a
# certificate signed by our CA.
listener 8884
allow_anonymous true
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate true

# MQTT over secure WebSocket (wss).
listener 8081
protocol websockets
allow_anonymous true
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
